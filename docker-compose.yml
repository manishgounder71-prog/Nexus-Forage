version: '3.8'

services:
  # ── FastAPI Multi-Agent Engine (Lyzr, Qdrant, Omi, Connectors) ────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_forge_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DEMO_MODE=true
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=sqlite+aiosqlite:///./nexus_forge.db
      - LYZR_API_KEY=${LYZR_API_KEY:-}
      - OMI_API_KEY=${OMI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - WEBHOOK_SECRET_KEY=${WEBHOOK_SECRET_KEY:-nexus-secret-key-production-32b}
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - backend_db_data:/app/nexus_forge.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nexus-network

  # ── Qdrant Vector Search Engine (Cross-Mission Memory Store) ─────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nexus_forge_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /healthz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - nexus-network

  # ── High-Performance Nginx Frontend Reverse Proxy ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus_forge_frontend
    restart: unless-stopped
    ports:
      - "5500:5500"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5500/"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - nexus-network

volumes:
  qdrant_storage:
    driver: local
  backend_db_data:
    driver: local

networks:
  nexus-network:
    driver: bridge
